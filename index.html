function productsPanel(){return `<div class="dash-top"><p>أضف الأقسام أولًا ثم المنتجات داخلها.</p><div><button class="ghost" data-add-category>+ قسم</button> <button class="primary" data-add-product>+ منتج</button></div></div><section class="panel"><h2>الأقسام</h2><div class="categories">${state.categories.map(c=>`<article class="category-card"><img src="${c.image_url||'assets/category-placeholder.svg'}"><div><h3>${esc(c.name)}</h3><button class="ghost" data-edit-category="${c.id}">تعديل</button></div></article>`).join('')||'<div class="empty">ابدأ بإضافة أول قسم</div>'}</div></section><section class="panel"><h2>المنتجات والمخزون</h2><div class="products">${state.products.map(p=>`<article class="product-card"><img src="${p.image_url||'assets/product-placeholder.svg'}"><div class="product-body"><h3>${esc(p.name)}</h3><small>المخزون: ${p.stock} ${esc(p.unit)}</small><div class="price"><b>${money(p.price)}</b></div><button class="ghost" data-edit-product="${p.id}">تعديل المنتج</button></div></article>`).join('')||'<div class="empty">لا توجد منتجات — اضغط إضافة منتج</div>'}</div></section>`}
function peoplePanel(key,label){return `<div class="dash-top"><p>إضافة وتعديل بيانات ${label}.</p><button class="primary" data-add-person="${key}">+ إضافة ${label}</button></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>البريد</th><th>الإجراء</th></tr></thead><tbody>${state[key].map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone||'—')}</td><td>${esc(x.email||'—')}</td><td><button class="ghost" data-edit-person="${key}:${x.id}">تعديل</button></td></tr>`).join('')||`<tr><td colspan="4">لا يوجد ${label}ون حاليًا</td></tr>`}</tbody></table></div></section>`}
function accountsPanel(s){return `<div class="metrics"><article class="metric"><span>الخزنة</span><b>${money(s.cash)}</b></article><article class="metric"><span>صافي الربح</span><b>${money(s.profit)}</b></article><article class="metric"><span>المبيعات المسلّمة</span><b>${money(s.sales)}</b></article><article class="metric"><span>تكلفة المخزون</span><b>${money(s.inventory)}</b></article></div><section class="panel"><div class="dash-top"><h2>الحركات المالية</h2><button class="primary" data-expense>+ تسجيل مصروف</button></div><div class="table-wrap"><table><thead><tr><th>البيان</th><th>النوع</th><th>القيمة</th><th>التاريخ</th></tr></thead><tbody>${state.tx.map(x=>`<tr><td>${esc(x.description)}</td><td>${esc(x.kind)}</td><td>${money(x.amount)}</td><td>${new Date(x.created_at).toLocaleDateString('ar-EG')}</td></tr>`).join('')||'<tr><td colspan="4">لا توجد حركات</td></tr>'}</tbody></table></div></section>`}
function reviewsPanel(){let product=state.reviews.map(r=>`<article class="review-row"><div><b>${esc(r.product_name)}</b><span>${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span></div><p>${esc(r.review||'بدون تعليق')}</p><small>${esc(r.customer_email)} · تقييم منتج</small></article>`),orders=state.orders.filter(o=>o.rating).map(o=>`<article class="review-row"><div><b>${esc(o.customer_name)}</b><span>${'★'.repeat(o.rating)}${'☆'.repeat(5-o.rating)}</span></div><p>${esc(o.review||'بدون تعليق')}</p><small>${esc(o.order_number)} · تقييم طلب</small></article>`);return `<section class="panel"><h2>آراء العملاء</h2>${[...product,...orders].join('')||'<div class="empty">لا توجد تقييمات بعد</div>'}</section>`}
function permissionsPanel(){return `<section class="panel permissions-intro"><div><small>إدارة الوصول</small><h2>الصلاحيات حسب البريد</h2><p>أضف البريد مرة واحدة وحدد الصفحات المتاحة له. بعد تسجيل دخوله بحساب Google يتعرف عليه الموقع تلقائيًا.</p></div><button class="primary" data-add-permission>+ إضافة بريد</button></section><section class="panel"><div class="table-wrap"><table><thead><tr><th>المستخدم</th><th>واجهة العميل</th><th>المندوب</th><th>الإدارة</th><th>الحالة</th><th>الإجراء</th></tr></thead><tbody>${state.users.map(u=>`<tr><td><b>${esc(u.display_name||'بدون اسم')}</b><br><small>${esc(u.email)}</small></td><td>${u.can_store?'✓':'—'}</td><td>${u.can_driver?'✓':'—'}</td><td>${u.can_admin?'✓':'—'}</td><td><span class="status">${u.active?'نشط':'موقوف'}</span></td><td><button class="ghost" data-edit-permission="${u.id}">تعديل</button></td></tr>`).join('')||'<tr><td colspan="6">لا توجد حسابات مضافة</td></tr>'}</tbody></table></div></section>`}
function settingsPanel(){let s=state.settings;return `<section class="panel"><h2>هوية وإعدادات الموقع</h2><form id="settingsForm" class="form-grid"><label class="field"><span>اسم المنصة</span><input name="platform_name" value="${esc(s.platform_name)}"></label><label class="field"><span>الاسم التجاري</span><input name="business_name" value="${esc(s.business_name)}"></label><label class="field"><span>الهاتف</span><input name="phone" value="${esc(s.phone||'')}"></label><label class="field"><span>واتساب</span><input name="whatsapp" value="${esc(s.whatsapp||'')}"></label><label class="field"><span>البريد</span><input name="email" value="${esc(s.email||'')}"></label><label class="field"><span>العملة</span><input name="default_currency" value="${esc(s.default_currency||'ل.ت')}"></label><label class="field full"><span>العنوان</span><input name="address" value="${esc(s.address||'')}"></label><label class="field full"><span>نص أسفل الموقع</span><textarea name="footer_text">${esc(s.footer_text||'')}</textarea></label><label class="field full"><span>شعار الموقع</span><input type="file" name="logo" accept="image/*"></label><button class="primary" type="submit">حفظ الإعدادات</button></form></section><section class="panel"><h2>أدوات الإدارة</h2><p>يمسح بيانات التشغيل ويحافظ على هوية الموقع.</p><button class="danger" data-reset>تصفير بيانات الموقع</button></section>`}
function modal(title,body,submit){$('#modalRoot').innerHTML=`<div class="modal-wrap"><form class="modal-card" id="dialogForm"><h2>${title}</h2>${body}<div class="modal-actions"><button type="button" class="ghost" data-modal-close>إلغاء</button>${submit?`<button class="primary" type="submit">${submit}</button>`:''}</div></form></div>`;document.querySelectorAll('[data-modal-close]').forEach(b=>b.onclick=closeModal)}
function closeModal(){$('#modalRoot').innerHTML=''}
async function upload(file,bucket){if(!file)return null;let path=`${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'-')}`;let r=await db.storage.from(bucket).upload(path,file);if(r.error)throw r.error;return db.storage.from(bucket).getPublicUrl(path).data.publicUrl}
function checkout(){if(!state.session){modal('تسجيل الدخول مطلوب','<p>سجّل الدخول بحساب Google لإتمام الطلب. ستظل المنتجات محفوظة في السلة.</p>',null);let actions=$('.modal-actions');actions.insertAdjacentHTML('beforeend','<button type="button" class="primary" data-login>تسجيل الدخول بحساب Google</button>');bind();return}let email=state.session.user.email||'',name=state.session.user.user_metadata?.full_name||'';modal('إتمام الطلب',`<div class="form-grid"><label class="field"><span>الاسم</span><input required name="name" value="${esc(name)}"></label><label class="field"><span>الهاتف</span><input required name="phone"></label><label class="field"><span>البريد المسجل</span><input required readonly type="email" name="email" value="${esc(email)}"></label><label class="field"><span>المنطقة</span><input required name="area"></label><label class="field full"><span>العنوان بالتفصيل</span><textarea required name="address"></textarea></label><label class="field"><span>وقت التوصيل</span><input name="delivery_time" placeholder="أقرب وقت"></label><label class="field"><span>طريقة الدفع</span><select name="payment_method"><option>نقدي</option><option>تحويل</option></select></label></div>`,`تأكيد الطلب — ${money(cartTotal())}`);$('#dialogForm').onsubmit=submitOrder}
async function submitOrder(e){e.preventDefault();let f=new FormData(e.target),customer={name:f.get('name'),phone:f.get('phone'),email:f.get('email'),address:f.get('address')};let existing=state.customers.find(x=>x.phone===customer.phone||x.email===customer.email),cid=existing?.id;if(!cid){let r=await db.from('customers').insert(customer).select().single();if(r.error)return toast(r.error.message);cid=r.data.id}let items=state.cart.map(x=>{let p=state.products.find(p=>p.id===x.id),price=Number(p.offer_active&&p.offer_price?p.offer_price:p.price);return{id:p.id,name:p.name,qty:x.qty,unit:p.unit,price,subtotal:price*x.qty}});let order={order_number:`ORD-${Date.now().toString().slice(-7)}`,customer_id:cid,customer_name:customer.name,phone:customer.phone,email:customer.email,area:f.get('area'),address:customer.address,delivery_time:f.get('delivery_time')||'أقرب وقت',payment_method:f.get('payment_method'),items,total:cartTotal(),status:cartTotal()>1000?'تحتاج موافقة':'طلب جديد'};let r=await db.from('orders').insert(order);if(r.error)return toast(r.error.message);state.cart=[];localStorage.qitaf_cart='[]';closeModal();toast('تم تسجيل الطلب بنجاح');await load()}
function showOrder(id){let o=state.orders.find(x=>x.id===id);modal(`تفاصيل الطلب ${esc(o.order_number)}`,`<p><b>العميل:</b> ${esc(o.customer_name)} — ${esc(o.phone)}</p><p><b>العنوان:</b> ${esc(o.area)}، ${esc(o.address||'')}</p><div class="table-wrap"><table><thead><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>${(o.items||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty} ${esc(x.unit||'')}</td><td>${money(x.price)}</td><td>${money(x.subtotal||x.price*x.qty)}</td></tr>`).join('')}</tbody></table></div><div class="cart-total"><span>الإجمالي</span><b>${money(o.total)}</b></div>`,null)}
function printInvoice(id){let o=state.orders.find(x=>x.id===id),logo=state.settings.logo_url||'assets/logo.svg';let el=document.createElement('article');el.className='print-sheet';el.innerHTML=`<header><div><h1>فاتورة بيع</h1><p>${esc(o.order_number)}</p></div><div><img class="print-logo" src="${logo}"><h2>${esc(state.settings.platform_name)}</h2></div></header><p><b>العميل:</b> ${esc(o.customer_name)} &nbsp; <b>الهاتف:</b> ${esc(o.phone)}</p><p><b>العنوان:</b> ${esc(o.area)} — ${esc(o.address||'')}</p><table><thead><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>${(o.items||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(x.subtotal||x.price*x.qty)}</td></tr>`).join('')}</tbody></table><h2>الإجمالي: ${money(o.total)}</h2><footer>${esc(state.settings.invoice_note||'شكرًا لتعاملكم معنا')}</footer>`;document.body.append(el);window.print();setTimeout(()=>el.remove(),1000)}
async function changeStatus(id,status){let r=status==='تم التسليم'?await db.rpc('complete_order',{p_order_id:id}):await db.from('orders').update({status}).eq('id',id);if(r.error){toast(r.error.message);return load()}toast(status==='تم التسليم'?'تم التسليم وتسجيل الحسابات':'تم تحديث الحالة');await load()}
function categoryForm(id){let x=state.categories.find(x=>x.id===id)||{};modal(id?'تعديل القسم':'إضافة قسم',`<div class="form-grid"><label class="field full"><span>اسم القسم</span><input required name="name" value="${esc(x.name||'')}"></label><label class="field full"><span>صورة القسم</span><input type="file" name="image" accept="image/*"></label></div>`,id?'حفظ التعديل':'إضافة القسم');$('#dialogForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),data={name:f.get('name')};try{let u=await upload(f.get('image').size?f.get('image'):null,'category-images');if(u)data.image_url=u;let r=id?await db.from('categories').update(data).eq('id',id):await db.from('categories').insert(data);if(r.error)throw r.error;closeModal();toast('تم حفظ القسم');load()}catch(x){toast(x.message)}}}
function productForm(id){let x=state.products.find(x=>x.id===id)||{};modal(id?'تعديل المنتج':'إضافة منتج',`<div class="form-grid"><label class="field"><span>اسم المنتج</span><input required name="name" value="${esc(x.name||'')}"></label><label class="field"><span>القسم</span><select required name="category">${state.categories.map(c=>`<option value="${c.id}" ${x.category_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label class="field"><span>الوحدة</span><select name="unit"><option ${x.unit==='كيلو'?'selected':''}>كيلو</option><option ${x.unit==='صندوق'?'selected':''}>صندوق</option><option ${x.unit==='قطعة'?'selected':''}>قطعة</option></select></label><label class="field"><span>الكمية</span><input required type="number" step=".01" name="stock" value="${x.stock||0}"></label><label class="field"><span>التكلفة</span><input required type="number" step=".01" name="cost" value="${x.cost||0}"></label><label class="field"><span>سعر البيع</span><input required type="number" step=".01" name="price" value="${x.price||0}"></label><label class="field"><span>خصم %</span><input type="number" step=".01" name="discount" value="${x.discount_percent||0}"></label><label class="field"><span>تفعيل العرض</span><select name="offer"><option value="false">لا</option><option value="true" ${x.offer_active?'selected':''}>نعم</option></select></label><label class="field full"><span>صورة المنتج</span><input type="file" name="image" accept="image/*"></label></div>`,id?'حفظ التعديل':'إضافة المنتج');$('#dialogForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),c=state.categories.find(c=>c.id===f.get('category')),price=Number(f.get('price')),d=Number(f.get('discount'));let data={name:f.get('name'),category_id:c.id,category_name:c.name,unit:f.get('unit'),stock:Number(f.get('stock')),cost:Number(f.get('cost')),price,discount_percent:d,offer_active:f.get('offer')==='true',offer_price:d?price*(1-d/100):null};try{let u=await upload(f.get('image').size?f.get('image'):null,'product-images');if(u)data.image_url=u;let r=id?await db.from('products').update(data).eq('id',id):await db.from('products').insert(data);if(r.error)throw r.error;closeModal();toast('تم حفظ المنتج');load()}catch(x){toast(x.message)}}}
function personForm(key,id){let x=state[key].find(x=>x.id===id)||{},labels={drivers:'مندوب',suppliers:'مورد',customers:'عميل'};modal(id?`تعديل ${labels[key]}`:`إضافة ${labels[key]}`,`<div class="form-grid"><label class="field"><span>الاسم</span><input required name="name" value="${esc(x.name||'')}"></label><label class="field"><span>رقم الهاتف</span><input ${key==='customers'?'required':''} name="phone" value="${esc(x.phone||'')}"></label><label class="field"><span>البريد</span><input ${key==='customers'?'required':''} type="email" name="email" value="${esc(x.email||'')}"></label><label class="field"><span>العنوان / المناطق</span><input name="address" value="${esc(x.address||(x.areas||[]).join(', '))}"></label><label class="field full"><span>ملاحظات</span><textarea name="notes">${esc(x.notes||'')}</textarea></label></div>`,id?'حفظ':'إضافة');$('#dialogForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),data={name:f.get('name'),phone:f.get('phone')||null,email:f.get('email')||null,notes:f.get('notes')||null};if(key==='drivers')data.areas=(f.get('address')||'').split(',').map(x=>x.trim()).filter(Boolean);else data.address=f.get('address')||null;let r=id?await db.from(key).update(data).eq('id',id):await db.from(key).insert(data);if(r.error)return toast(r.error.message);closeModal();toast('تم الحفظ');load()}}
function accountLookup(){modal('متابعة طلباتي',`<div class="field"><span>أدخل رقم الهاتف المستخدم في الطلب</span><input required name="phone"></div>`,'عرض الطلبات');$('#dialogForm').onsubmit=e=>{e.preventDefault();let p=new FormData(e.target).get('phone'),orders=state.orders.filter(o=>o.phone===p);modal('طلباتي',orders.map(o=>`<article class="panel"><b>${esc(o.order_number)}</b><p><span class="status">${esc(o.status)}</span> — ${money(o.total)}</p>${o.status==='تم التسليم'&&!o.rating?`<button class="ghost" data-rate="${o.id}">تقييم الطلب</button>`:''}</article>`).join('')||'<div class="empty">لا توجد طلبات بهذا الرقم</div>',null);bind()}}
function expenseForm(){modal('تسجيل مصروف',`<div class="form-grid"><label class="field"><span>البيان</span><input required name="title"></label><label class="field"><span>القيمة</span><input required type="number" step=".01" name="amount"></label><label class="field full"><span>ملاحظات</span><textarea name="notes"></textarea></label></div>`,'حفظ المصروف');$('#dialogForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),r=await db.rpc('record_expense',{p_title:f.get('title'),p_amount:Number(f.get('amount')),p_notes:f.get('notes')});if(r.error)return toast(r.error.message);closeModal();toast('تم تسجيل المصروف');load()}}
function rateForm(id){modal('تقييم الطلب',`<div class="form-grid"><label class="field"><span>التقييم</span><select name="rating"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select></label><label class="field full"><span>رأيك</span><textarea name="review"></textarea></label></div>`,'حفظ التقييم');$('#dialogForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);await db.from('orders').update({rating:Number(f.get('rating')),review:f.get('review'),review_date:new Date().toISOString()}).eq('id',id);closeModal();toast('شكرًا لتقييمك');load()}}
function rateProductForm(orderId,productId){let o=state.orders.find(x=>x.id===orderId),p=(o?.items||[]).find(x=>x.id===productId);modal(`تقييم ${esc(p?.name||'المنتج')}`,`<div class="rating-stars" role="radiogroup">${[5,4,3,2,1].map(n=>`<label><input type="radio" name="rating" value="${n}" ${n===5?'checked':''}><span>★</span></label>`).join('')}</div><label class="field"><span>اكتب رأيك في المنتج</span><textarea name="review" rows="4" placeholder="رأيك يساعدنا ويساعد عملاء قِطاف"></textarea></label>`,'حفظ التقييم');$('#dialogForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),data={order_id:orderId,product_id:productId,product_name:p?.name||'منتج',customer_email:state.session.user.email,rating:Number(f.get('rating')),review:f.get('review')};let r=await db.from('product_reviews').insert(data);if(r.error)return toast(r.error.message);closeModal();toast('شكرًا، تم حفظ تقييم المنتج');await load();accountPage()}}
async function saveSettings(e){e.preventDefault();let f=new FormData(e.target),data=Object.fromEntries(['platform_name','business_name','phone','whatsapp','email','default_currency','address','footer_text'].map(k=>[k,f.get(k)]));try{let file=f.get('logo'),u=await upload(file?.size?file:null,'brand-assets');if(u)data.logo_url=u;let r=await db.from('platform_settings').update(data).eq('id',1);if(r.error)throw r.error;toast('تم حفظ إعدادات الموقع');load()}catch(x){toast(x.message)}}
function printReport(){let s=stats(),logo=state.settings.logo_url||'assets/logo.svg',el=document.createElement('article');el.className='print-sheet';el.innerHTML=`<header><div><h1>تقرير المنصة</h1><p>${new Date().toLocaleString('ar-EG')}</p></div><div><img class="print-logo" src="${logo}"><h2>${esc(state.settings.platform_name)}</h2></div></header><h2>الملخص المالي</h2><table><tr><th>الخزنة</th><td>${money(s.cash)}</td><th>صافي الربح</th><td>${money(s.profit)}</td></tr><tr><th>المبيعات</th><td>${money(s.sales)}</td><th>تكلفة المخزون</th><td>${money(s.inventory)}</td></tr><tr><th>المصروفات</th><td>${money(s.expenses)}</td><th>الطلبات</th><td>${state.orders.length}</td></tr></table><h2>آخر الطلبات</h2><table><thead><tr><th>الرقم</th><th>العميل</th><th>الحالة</th><th>القيمة</th></tr></thead><tbody>${state.orders.slice(0,15).map(o=>`<tr><td>${esc(o.order_number)}</td><td>${esc(o.customer_name)}</td><td>${esc(o.status)}</td><td>${money(o.total)}</td></tr>`).join('')}</tbody></table><footer>تقرير مستقل صادر من نظام ${esc(state.settings.platform_name)}</footer>`;document.body.append(el);window.print();setTimeout(()=>el.remove(),1000)}
function loginPage(){$('#modalRoot').innerHTML=`<div class="login-page"><section class="login-journey"><div class="login-brand">${brand('light')}<p>من اختيارك لحد بابك، كل خطوة واضحة.</p></div><div class="journey-stream"><article><i>01</i><div><small>طلب جديد</small><b>اختياراتك اتسجلت</b></div><span>✓</span></article><article><i>02</i><div><small>يتم التجهيز</small><b>طلبك بيتجهز بعناية</b></div><span>•••</span></article><article><i>03</i><div><small>في الطريق</small><b>المندوب اتحرك إليك</b></div><span>↗</span></article></div><div class="login-promise"><span>طلب منظم</span><span>متابعة مباشرة</span><span>فاتورة واضحة</span></div></section><section class="login-panel-wrap"><button class="login-close" data-modal-close aria-label="إغلاق">×</button><div class="login-panel"><img src="${esc(state.settings.logo_url||'assets/logo.svg')}" alt="شعار ${esc(state.settings.platform_name)}"><small>أهلًا بك في ${esc(state.settings.platform_name)}</small><h1>حساب واحد لكل طلباتك</h1><p>سجّل بحساب Google لمتابعة حالة الطلب، طباعة الفاتورة وتقييم المنتجات بعد الاستلام.</p><button class="google-button" data-google-login><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.5-.2-2.2H12v4h5.4a4.6 4.6 0 0 1-2 3v2.6h3.3c1.9-1.8 2.9-4.4 2.9-7.4z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.7-2.4L15.4 17c-.9.6-2.1 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3v2.7A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.4 13.9A6 6 0 0 1 6.1 12c0-.7.1-1.3.3-1.9V7.4H3A10 10 0 0 0 2 12c0 1.7.4 3.2 1 4.6l3.4-2.7z"/><path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.8A9.7 9.7 0 0 0 12 2a10 10 0 0 0-9 5.4l3.4 2.7C7.2 7.8 9.4 6 12 6z"/></svg><span>المتابعة باستخدام Google</span></button><div class="login-note"><i>🔒</i><span>نستخدم بريدك فقط لعرض طلباتك وصلاحيات حسابك.</span></div></div></section></div>`;bind()}
async function googleLogin(){let r=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});if(r.error)toast(r.error.message)}
async function logout(){await db.auth.signOut();state.session=null;state.permissions={can_store:true,can_driver:false,can_admin:false,active:true};location.hash='store';render();toast('تم تسجيل الخروج')}
function orderStage(status){let stages=['طلب جديد','يتم التجهيز','في الطريق','تم التسليم'],i=Math.max(0,stages.indexOf(status));return `<div class="order-progress">${stages.map((s,n)=>`<div class="${n<=i?'done':''}"><i>${n<i?'✓':n+1}</i><span>${s}</span></div>`).join('')}</div>`}
function accountPage(){let email=(state.session?.user?.email||'').toLowerCase(),orders=state.orders.filter(o=>(o.email||'').toLowerCase()===email),delivered=orders.filter(o=>o.status==='تم التسليم').length,pending=orders.length-delivered,name=state.session?.user?.user_metadata?.full_name||'عميل قِطاف',avatar=state.session?.user?.user_metadata?.avatar_url;$('#modalRoot').innerHTML=`<div class="account-page"><header>${brand('light')}<button class="account-close" data-modal-close aria-label="إغلاق">×</button></header><div class="account-layout"><aside class="account-side"><div class="account-person">${avatar?`<img src="${esc(avatar)}" alt="">`:`<span>${esc(name.slice(0,1))}</span>`}<h2>${esc(name)}</h2><p>${esc(email)}</p></div><nav><button class="active">طلباتي</button>${state.permissions.can_driver?'<a href="#driver">لوحة المندوب</a>':''}${state.permissions.can_admin?'<a href="#admin">لوحة الإدارة</a>':''}</nav><button class="account-logout" data-logout>تسجيل الخروج</button></aside><main class="account-main"><div class="account-heading"><div><small>حسابي</small><h1>طلباتك من أول ضغطة لحد الاستلام</h1></div><a class="button account-shop" href="#products" data-modal-close>تسوق الآن</a></div><div class="account-metrics"><article><span>كل الطلبات</span><b>${orders.length}</b></article><article><span>قيد التنفيذ</span><b>${pending}</b></article><article><span>تم تسليمها</span><b>${delivered}</b></article></div><section class="account-orders">${orders.map(o=>`<article class="account-order"><div class="account-order-top"><div><small>${new Date(o.created_at).toLocaleDateString('ar-EG')}</small><h3>${esc(o.order_number)}</h3></div><b>${money(o.total)}</b></div>${orderStage(o.status)}<div class="order-products">${(o.items||[]).map(x=>{let reviewed=state.reviews.some(r=>r.order_id===o.id&&r.product_id===x.id);return `<div><span>${esc(x.name)} × ${x.qty}</span>${o.status==='تم التسليم'?reviewed?'<em>تم التقييم ✓</em>':`<button data-rate-product="${o.id}:${x.id}">قيّم المنتج</button>`:''}</div>`}).join('')}</div><div class="row-actions"><button class="ghost" data-order="${o.id}">تفاصيل الطلب</button><button class="ghost" data-invoice="${o.id}">طباعة الفاتورة</button></div></article>`).join('')||'<div class="account-empty"><b>لسه ما طلبتش من قِطاف</b><p>أول طلب ليك هيظهر هنا وتقدر تتابع حالته خطوة بخطوة.</p><a class="button primary" href="#products" data-modal-close>ابدأ التسوق</a></div>'}</section></main></div></div>`;bind()}
function myOrders(){accountPage()}
function userMenu(){accountPage()}
async function refreshAuth(){await loadAuth();toast('تم تحديث الصلاحيات');render()}
function permissionForm(id){let u=state.users.find(x=>x.id===id)||{can_store:true,can_driver:false,can_admin:false,active:true};modal(id?'تعديل الصلاحيات':'إضافة بريد وصلاحيات',`<div class="form-grid"><label class="field full"><span>البريد الإلكتروني</span><input required type="email" name="email" value="${esc(u.email||'')}" ${id?'readonly':''}></label><label class="field full"><span>اسم المستخدم — اختياري</span><input name="display_name" value="${esc(u.display_name||'')}"></label><label class="check-card"><input type="checkbox" name="can_store" ${u.can_store?'checked':''}><span><b>واجهة العميل</b><small>المتجر والسلة والحساب</small></span></label><label class="check-card"><input type="checkbox" name="can_driver" ${u.can_driver?'checked':''}><span><b>لوحة المندوب</b><small>طلبات التوصيل والتحصيل</small></span></label><label class="check-card"><input type="checkbox" name="can_admin" ${u.can_admin?'checked':''}><span><b>لوحة الإدارة</b><small>إدارة المنصة بالكامل</small></span></label><label class="check-card"><input type="checkbox" name="active" ${u.active?'checked':''}><span><b>الحساب نشط</b><small>إيقافه يمنع الوصول للوحات</small></span></label></div>`,'حفظ الصلاحيات');$('#dialogForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),r=await db.rpc('admin_save_permission',{p_email:f.get('email'),p_display_name:f.get('display_name'),p_can_store:f.has('can_store'),p_can_driver:f.has('can_driver'),p_can_admin:f.has('can_admin'),p_active:f.has('active')});if(r.error)return toast(r.error.message);closeModal();toast('تم حفظ البريد والصلاحيات');await load()}}
function bind(){document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{state.panel=b.dataset.panel;render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{let x=state.cart.find(x=>x.id===b.dataset.add);x?x.qty++:state.cart.push({id:b.dataset.add,qty:1});localStorage.qitaf_cart=JSON.stringify(state.cart);render();toast('أضيف إلى السلة')});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.cart=state.cart.filter(x=>x.id!==b.dataset.remove);localStorage.qitaf_cart=JSON.stringify(state.cart);render()});document.querySelectorAll('[data-cart]').forEach(b=>b.onclick=()=>{$('.drawer').classList.add('open');$('.overlay').classList.add('show')});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{$('.drawer')?.classList.remove('open');$('.overlay')?.classList.remove('show')});$('[data-checkout]')&&($('[data-checkout]').onclick=checkout);$('[data-account]')&&($('[data-account]').onclick=accountLookup);document.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>{localStorage.qitaf_welcome_seen='1';$('.welcome')?.remove()});let welcomeVideo=$('.welcome video');if(welcomeVideo)welcomeVideo.onended=()=>{localStorage.qitaf_welcome_seen='1';$('.welcome')?.remove()};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{$('#productGrid').innerHTML=productCards(b.dataset.cat);location.hash='products'});$('#allProducts')&&($('#allProducts').onclick=()=>$('#productGrid').innerHTML=productCards());document.querySelectorAll('[data-status]').forEach(s=>s.onchange=()=>changeStatus(s.dataset.status,s.value));document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>showOrder(b.dataset.order));document.querySelectorAll('[data-invoice]').forEach(b=>b.onclick=()=>printInvoice(b.dataset.invoice));$('[data-add-category]')&&($('[data-add-category]').onclick=()=>categoryForm());document.querySelectorAll('[data-edit-category]').forEach(b=>b.onclick=()=>categoryForm(b.dataset.editCategory));$('[data-add-product]')&&($('[data-add-product]').onclick=()=>productForm());document.querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=()=>productForm(b.dataset.editProduct));document.querySelectorAll('[data-add-person]').forEach(b=>b.onclick=()=>personForm(b.dataset.addPerson));document.querySelectorAll('[data-edit-person]').forEach(b=>b.onclick=()=>{let[k,id]=b.dataset.editPerson.split(':');personForm(k,id)});$('[data-expense]')&&($('[data-expense]').onclick=expenseForm);document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rateForm(b.dataset.rate));document.querySelectorAll('[data-rate-product]').forEach(b=>b.onclick=()=>{let[o,p]=b.dataset.rateProduct.split(':');rateProductForm(o,p)});$('#settingsForm')&&($('#settingsForm').onsubmit=saveSettings);$('[data-print]')&&($('[data-print]').onclick=printReport);$('[data-reset]')&&($('[data-reset]').onclick=async()=>{if(prompt('اكتب كلمة تصفير للتأكيد')!=='تصفير')return;let r=await db.rpc('reset_review_data');if(r.error)return toast(r.error.message);toast('تم تصفير بيانات التشغيل');load()});document.querySelectorAll('[data-login]').forEach(b=>b.onclick=loginPage);document.querySelectorAll('[data-google-login]').forEach(b=>b.onclick=googleLogin);document.querySelectorAll('[data-refresh-auth]').forEach(b=>b.onclick=refreshAuth);document.querySelectorAll('[data-logout]').forEach(b=>b.onclick=logout);document.querySelectorAll('[data-user-menu]').forEach(b=>b.onclick=userMenu);document.querySelectorAll('[data-my-orders]').forEach(b=>b.onclick=myOrders);document.querySelectorAll('[data-add-permission]').forEach(b=>b.onclick=()=>permissionForm());document.querySelectorAll('[data-edit-permission]').forEach(b=>b.onclick=()=>permissionForm(b.dataset.editPermission));document.querySelectorAll('[data-modal-close]').forEach(b=>b.onclick=closeModal)}
addEventListener('hashchange',()=>{state.panel=route()==='admin'?'overview':'orders';render()});
render();
load().catch(e=>{console.error(e);toast('تعذر تحميل البيانات — الواجهة تعمل بوضع المراجعة')});
db.auth.onAuthStateChange((event)=>{if(event==='SIGNED_IN'||event==='SIGNED_OUT')setTimeout(()=>load().catch(console.error),0)});
</script>
